const KEY='crestie-lost-timeline-v3';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.done))state={team:'',cls:'',done:[],answers:{},bonusDone:[],bonusPoints:0,final:false};if(!state.answers)state.answers={};let order=[2,0,1];let screen='home',current=0,step=0,selected=-1,feedback=false,bonusQuestion=-1,bonusFrom='home',finalStep=0,finalSelected=-1;
const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hide'),2400)}function celebrate(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<26;i++){let x=document.createElement('div');x.className='confetti';x.style.left=Math.random()*100+'vw';x.style.background=['#f3c94c','#4ec7bc','#e872a1','#4f91d8'][i%4];x.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}}function score(){return state.done.length*30+state.bonusPoints+(state.final?20:0)}function render(){let html='';if(!state.team){html=`<section class="panel"><h2 class="story-title">⚡ CHAPTER 1: The Time Rift</h2><div class="scene"><img class="character" src="crestie-surprise.png" alt="Crestie is shocked"><p>“Explorers! My time compass shattered across Singapore’s history. Six lost crystals hold the power to restore our Shield of Singapore. Will you help me?”</p></div><div class="mini-map"><span>🧭</span><span>⌛</span><span>💎</span><span>🛡️</span></div><label for="cls">Select your class</label><select id="cls"><option value="">Choose class</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}">Class ${i+1}</option>`).join('')}</select><label for="team">Select your team</label><select id="team"><option value="">Choose team</option>${Array.from({length:5},(_,i)=>`<option value="${i+1}">Team ${i+1}</option>`).join('')}</select><button class="btn" id="start">Start the adventure!</button><div class="info" style="margin-top:12px">One phone per team. Team names and scores are stored only on this device in this prototype.</div></section>`;app.innerHTML=html;document.getElementById('start').onclick=()=>{let c=document.getElementById('cls').value,t=document.getElementById('team').value;if(!c||!t)return toast('Please choose a class and team.');state.cls=c;state.team=t;save();render()};return}
const top=`<section class="panel"><div class="row"><strong>Class ${esc(state.cls)} · Team ${esc(state.team)}</strong><span class="pill">⭐ ${score()} points</span></div><p class="small muted">${state.done.length} of 6 missions complete</p><div class="bar" aria-label="Mission progress"><div style="width:${state.done.length/6*100}%"></div></div><div class="crystals" aria-label="Collected crystals">${missions.map((m,i)=>`<span class="${state.done.includes(i)?'on':''}" title="${state.done.includes(i)?'Collected':'Locked'}">${m.gem}</span>`).join('')}</div></section>`;

oveItem(KEY);location.reload()}};return}
if(screen==='mission'){const m=missions[current],done=state.done.includes(current),q=m.qs[step];html=top+`<section class="panel"><button class="btn secondary" id="back">← Mission menu</button><p class="tag" style="color:#ffdb7a;margin-top:18px">CHAPTER ${current+1} · ${esc(m.zone)}</p><h2>${esc(m.title)}</h2><div class="scene"><img class="character" src="crestie-think.png" alt="Crestie investigates"><p>“${esc(m.intro)} Find evidence in the gallery before answering. Every clue helps us restore the Shield!”</p></div>${done?`<div class="callout success">✓ Crystal already collected! You can revisit these questions without gaining duplicate points.</div>`:''}<div class="steps">${[0,1,2].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><p class="pill" style="display:inline-block">Challenge ${step+1}/3 · ${q.type}</p><div class="evidence">🔍 <strong>Gallery evidence:</strong> Find a display connected to this challenge. Record a detail your team actually observed. <small>This is a team evidence log, not an automatically verified exhibit answer.</small></div>${q.type==='Explore'?`<label for="evidence-note">What did your team actually see? (at least 12 characters)</label><textarea id="evidence-note" class="evidence-note" rows="3" placeholder="Name an object, image, date or phrase from the exhibit…">${esc(state.answers[current+'-'+step]||'')}</textarea>`:''}<h2>${esc(q.q)}</h2>${current===3&&step===1?`<p class="small muted">Arrange these three events in chronological order using the arrows.</p>${order.map((idx,i)=>`<div class="order-line"><strong>${i+1}. ${['Self-government (1959)','Merger with Malaysia (1963)','Independence (1965)'][idx]}</strong><button class="move" data-up="${i}" ${i===0?'disabled':''} aria-label="Move up">↑</button><button class="move" data-down="${i}" ${i===2?'disabled':''} aria-label="Move down">↓</button></div>`).join('')}`:q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${feedback&&i===q.a?'correct':''} ${feedback&&selected===i&&i!==q.a?'wrong':''}" data-a="${i}" ${feedback?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<button class="btn secondary" id="hint">💡 Crestie's hint</button><button class="btn" id="check" ${(current===3&&step===1)?(feedback?'disabled':''):(selected<0||feedback?'disabled':'')}>Check answer</button><div id="result"></div>${feedback&&selected===q.a?`<button class="btn" id="next">${step===2?'Collect crystal':'Next challenge →'}</button>`:''}</section>`;app.innerHTML=html;document.getElementById('back').onclick=()=>{screen='home';render()};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(q.type==='Explore'){let e=document.getElementById('evidence-note');if(e){state.answers[current+'-'+step]=e.value;save()}}selected=Number(b.dataset.a);render()});document.querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.up??b.dataset.down),j=b.hasAttribute('data-up')?i-1:i+1;[order[i],order[j]]=[order[j],order[i]];render()});document.getElementById('hint').onclick=()=>toast(q.hint);document.getElementById('check').onclick=()=>{if(q.type==='Explore'){let note=document.getElementById('evidence-note').value.trim();if(note.length<12)return toast('Write a detail your team found in the exhibition first.');state.answers[current+'-'+step]=note;save()}if(current===3&&step===1)selected=order.join(',')==='0,1,2'?q.a:-1;feedback=true;if(selected===q.a){celebrate();toast('Correct! Crestie is cheering! 🎉')}else toast('Not quite. Try again!');render()};if(feedback){document.getElementById('result').innerHTML=`<div class="callout ${selected===q.a?'success':'warning'}"><img class="feedback-face" src="crestie-${selected===q.a?'correct':'surprise'}.png" alt="Crestie reacts"><strong>${selected===q.a?'🎉 Correct!':'Try again!'}</strong><p>${selected===q.a?esc(q.explain):'Use the hint, talk to your team, and choose another answer.'}</p></div>`;if(selected!==q.a){document.getElementById('check').outerHTML='<button class="btn" id="retry">Try another answer</button>';document.getElementById('retry').onclick=()=>{feedback=false;selected=-1;render()}}else document.getElementById('next').onclick=()=>{if(step<2){step++;selected=-1;feedback=false;if(current===3&&step===1)order=[2,0,1];render()}else{if(!state.done.includes(current)){state.done.push(current);save();celebrate();toast('CHAPTER CLEARED — Crystal recovered! '+m.gem)}screen='reward';render()}}}return}
if(screen==='reward'){let m=missions[current];html=top+`<section class="panel" style="text-align:center"><img class="character" src="crestie-crystal.png" alt="Crestie celebrates with a crystal"><div style="font-size:75px;animation:pop .6s">${m.gem}</div><h2>CHAPTER CLEARED — Crystal recovered!</h2><p>Crestie found a mysterious crystal in <strong>${esc(m.zone)}</strong>.</p><div class="callout">Clue: “${esc(m.clue)}”</div><p class="small muted">Keep its meaning in mind. You will need it for the final Shield challenge.</p><button class="btn" id="home">Continue the Amazing Race →</button></section>`;app.innerHTML=html;document.getElementById('home').onclick=()=>{screen='home';render();maybeBonus()};return}
if(screen==='final'){if(state.final){html=top+`<section class="panel" style="text-align:center"><img class="character" src="crestie-cheer.png" alt="Crestie celebrating"><div class="shield">🛡️✨</div><h2>Shield of Singapore Activated!</h2><p>Six pillars. One Singapore.</p><h2>🏆 ${score()} points</h2><p>I can, you can, we can!</p><button class="btn" id="home">Return to missions</button></section>`;app.innerHTML=html;document.getElementById('home').onclick=()=>{screen='home';render()};return}
let m=missions[finalStep];html=top+`<section class="panel"><div class="shield">🛡️</div><h2>Activate the Shield of Singapore</h2><p>Match each crystal’s clue to the correct pillar of Total Defence.</p><div class="steps">${missions.map((_,i)=>`<span class="${i<=finalStep?'on':''}"></span>`).join('')}</div><h2>${m.gem} Crystal ${finalStep+1}/6</h2><div class="callout">“${esc(m.clue)}”</div>${['Military Defence','Civil Defence','Economic Defence','Social Defence','Psychological Defence','Digital Defence'].map((p,i)=>`<button class="choice ${finalSelected===i?'selected':''}" data-f="${i}">${esc(p)}</button>`).join('')}<button class="btn" id="verify" ${finalSelected<0?'disabled':''}>Place crystal in shield</button><button class="btn secondary" id="home">← Mission menu</button></section>`;app.innerHTML=html;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{finalSelected=Number(b.dataset.f);render()});document.getElementById('verify').onclick=()=>{if(['Military Defence','Civil Defence','Economic Defence','Social Defence','Psychological Defence','Digital Defence'][finalSelected]!==m.pillar)return toast('That pillar does not match the clue. Try again!');celebrate();if(finalStep===5){state.final=true;save();toast('The Shield is activated!');render()}else{finalStep++;finalSelected=-1;toast('Crystal placed!');render()}};document.getElementById('home').onclick=()=>{screen='home';render()};return}}
function openBonus(from){let available=bonuses.map((_,i)=>i).filter(i=>!state.bonusDone.includes(i));if(!available.length)return;bonusQuestion=available[Math.floor(Math.random()*available.length)];bonusFrom=from;selected=-1;drawBonus()}
function drawBonus(){let b=bonuses[bonusQuestion],el=document.getElementById('overlay');el.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Surprise bonus challenge"><div class="scene"><img class="character" src="crestie-surprise.png" alt="Crestie surprise"><p><strong>⚡ SURPRISE BONUS PORTAL!</strong><br>Crestie has discovered a bonus challenge! Win 5 points.</p></div><h2>${esc(b.q)}</h2>${b.o.map((o,i)=>`<button class="choice ${selected===i?'selected':''}" data-b="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<button class="btn" id="bonus-submit" ${selected<0?'disabled':''}>Submit answer</button><button class="btn secondary" id="bonus-later">Not now</button></div></div>`;el.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{selected=Number(x.dataset.b);drawBonus()});el.querySelector('#bonus-later').onclick=()=>{el.innerHTML=''};el.querySelector('#bonus-submit').onclick=()=>{let correct=selected===b.a;state.bonusDone.push(bonusQuestion);if(correct){state.bonusPoints+=5;celebrate()}save();el.innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="scene"><img class="character" src="crestie-${correct?'correct':'think'}.png" alt="Crestie reacts"><p><strong>${correct?'🎉 Brilliant! +5 points':'Good attempt, explorers!'}</strong><br>${correct?'You repaired a small crack in the timeline!':'The rift remains tricky. Keep exploring!'}</p></div><button class="btn" id="bonus-close">Continue adventure</button></div></div>`;el.querySelector('#bonus-close').onclick=()=>{el.innerHTML='';render()}}}
function maybeBonus(){if(state.done.length===0||state.done.length>=6)return;if(state.bonusDone.length>=3)return;if(state.done.length>state.bonusDone.length&&Math.random()<.85)window.setTimeout(()=>openBonus('home'),350)}
const originalRender=render;render=function(){originalRender()};
render();
</script></body></html>
