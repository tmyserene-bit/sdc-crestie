<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d51"><title>Crestie's Amazing Race — The Lost Timeline</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172b43;background:#eef4fb}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:16px 14px 80px}.hero{background:linear-gradient(135deg,#102d51,#236a8a);color:white;padding:22px;border-radius:22px;position:relative;overflow:hidden}.hero h1{font-size:clamp(25px,6vw,38px);line-height:1.1;margin:8px 0}.hero p{margin:7px 0;line-height:1.5}.mascot{font-size:70px;filter:drop-shadow(0 6px 3px #0003);animation:bob 2.4s ease-in-out infinite;display:inline-block}@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}.tag{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#bceef9;font-weight:800}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 3px 18px #0a2a4b10}.panel h2{margin:0 0 10px;font-size:21px}.muted{color:#5d7085}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.mission{border:2px solid #d9e6f3;background:#fff;border-radius:16px;text-align:left;padding:14px;min-height:125px;cursor:pointer;color:inherit}.mission:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #edac32;outline-offset:2px}.mission.done{border-color:#29a87b;background:#e9fbf3}.mission .gem{font-size:30px}.mission strong{display:block;margin:6px 0}.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;background:#156f9c;color:#fff;font-size:16px;font-weight:750;cursor:pointer;min-height:49px;margin-top:10px}.btn.secondary{background:#e9f2f9;color:#174365}.btn:disabled{opacity:.45;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;background:#f3f8fd;color:#1a3853;border:2px solid #dce8f3;border-radius:12px;padding:13px;margin:9px 0;font-size:16px;cursor:pointer;min-height:48px}.choice.selected{border-color:#15749f;background:#e2f3fd}.choice.correct{border-color:#209b70;background:#e5faed}.choice.wrong{border-color:#d95a64;background:#fff0f0}.bar{height:12px;background:#dbe7f1;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#36a98c;transition:width .3s}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#e8f1f8;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.callout{padding:12px;border-radius:12px;background:#f0f7ff;border-left:4px solid #2785ae;margin:10px 0}.success{background:#e8fbf0;border-left-color:#1da476}.warning{background:#fff8e7;border-left-color:#e8a927}.crystals{display:flex;gap:8px;flex-wrap:wrap;font-size:26px}.crystals span{filter:grayscale(1);opacity:.35}.crystals span.on{filter:none;opacity:1;animation:pop .5s ease}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}.hide{display:none!important}label{display:block;margin:12px 0 5px;font-weight:700}select,input{width:100%;font-size:16px;border:2px solid #cadbe9;border-radius:10px;padding:12px;background:#fff}footer{font-size:12px;color:#60758b;margin-top:20px;text-align:center}.toast{position:fixed;z-index:5;left:12px;right:12px;top:15px;max-width:500px;margin:auto;padding:15px;background:#113c62;color:#fff;border-radius:14px;box-shadow:0 8px 30px #0004;animation:pop .25s ease}.confetti{position:fixed;z-index:9;pointer-events:none;width:9px;height:13px;top:-20px;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}.tiny{font-size:12px}.steps{display:flex;gap:5px}.steps span{flex:1;background:#dce9f2;height:6px;border-radius:9px}.steps span.on{background:#25a781}.footer-actions{display:flex;gap:10px}.footer-actions .btn{flex:1}.shield{font-size:82px;text-align:center;filter:drop-shadow(0 4px 5px #1234)}.info{background:#fff7df;border-radius:12px;padding:12px;font-size:13px;color:#72551a}.notice{background:#f1f6fb;border-radius:10px;padding:10px;font-size:13px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><header class="hero"><span class="tag">Crest Secondary School · Prototype</span><div class="row"><div style="flex:1;min-width:210px"><h1>Crestie's Amazing Race</h1><p><strong>The Lost Timeline</strong></p><p>Six mysterious crystals. Six pillars of Total Defence. One Singapore to protect!</p></div><span class="mascot" aria-label="Penguin guide">🐧</span></div></header><div id="app"></div><footer>Prototype for on-site testing · Exhibit-specific prompts require verification · Progress saved on this device only</footer></main><div id="toast" class="toast hide" role="status" aria-live="polite"></div><script>
'use strict';
const missions=[
{title:'The Forgotten Port',zone:'The Beginnings',gem:'💛',pillar:'Economic Defence',clue:'A strong economy helps Singapore withstand challenges.',intro:'Travel to Singapore’s early trading days. Find how our island connected people and goods.',qs:[
{type:'Explore',q:'Explore The Beginnings. Which role did Singapore have before becoming a British trading port?',options:['A maritime trading centre','A snowy mountain resort','An airport hub'],a:0,hint:'Look for Singapore’s history before 1819.',explain:'Singapore had a history of maritime trade before British rule.'},
{type:'Solve',q:'Why was Singapore well placed for trade?',options:['It lies along important sea routes','It has a snowy climate','It is the largest country in Asia'],a:0,hint:'Think about where ships travel.',explain:'Singapore’s location helped connect regional and international trade.'},
{type:'Defend',q:'Which action best supports Economic Defence today?',options:['Learning useful skills and adapting to change','Wasting important resources','Refusing to learn new skills'],a:0,hint:'A resilient economy needs people who can adapt.',explain:'Skills, adaptability and resourcefulness help keep Singapore’s economy strong.'}]},
{title:'Voices from the Past',zone:'Days of Darkness',gem:'🧡',pillar:'Psychological Defence',clue:'We stay resilient when Singapore faces challenges.',intro:'Step into a difficult chapter of history and discover how people endured.',qs:[
{type:'Explore',q:'Explore Days of Darkness. Which period is this section about?',options:['The Japanese Occupation','The opening of Changi Airport','The first MRT ride'],a:0,hint:'Look for the wartime story presented in this area.',explain:'This section explores experiences during the Japanese Occupation.'},
{type:'Solve',q:'Which problem could civilians face during wartime?',options:['Shortages of essential supplies','Too many shopping malls','Too many public holidays'],a:0,hint:'Think about food and everyday necessities.',explain:'Wartime shortages affected ordinary families.'},
{type:'Defend',q:'What best shows Psychological Defence during a crisis?',options:['Staying calm, supporting others and not giving up','Spreading panic','Blaming people without evidence'],a:0,hint:'Think resilience and confidence.',explain:'Psychological Defence includes resilience, resolve and mutual support.'}]},
{title:'The Courage Code',zone:'Resistance and Resilience',gem:'💚',pillar:'Military Defence',clue:'We must be ready to defend Singapore.',intro:'Discover the courage of those who resisted occupation.',qs:[
{type:'Explore',q:'In Resistance and Resilience, what were resistance groups opposing?',options:['Japanese occupation','Singapore’s National Day','Modern digital devices'],a:0,hint:'Find out what was happening during the war.',explain:'Resistance groups opposed the Japanese occupation.'},
{type:'Solve',q:'Which word best describes standing up for what is right despite danger?',options:['Courage','Carelessness','Complacency'],a:0,hint:'It begins with C.',explain:'Courage means acting despite fear or difficulty.'},
{type:'Defend',q:'Which statement best reflects Military Defence today?',options:['A capable defence force helps protect Singapore','Defence is never necessary','Only other countries need to prepare'],a:0,hint:'Think about protecting our sovereignty.',explain:'Military Defence helps deter threats and safeguard Singapore.'}]},
{title:'The Independence Puzzle',zone:'The Road to Independence',gem:'💜',pillar:'Social Defence',clue:'People of different backgrounds stand together.',intro:'Singapore’s journey to nationhood is scrambled. Restore the dates!',qs:[
{type:'Explore',q:'Find Singapore’s independence milestone. In which year did Singapore become independent?',options:['1959','1963','1965'],a:2,hint:'Find the year associated with 9 August.',explain:'Singapore became independent on 9 August 1965.'},
{type:'Solve',q:'Which sequence is in the correct historical order?',options:['Independence → Self-government → Malaysia','Self-government → Malaysia → Independence','Malaysia → Independence → Self-government'],a:1,hint:'Compare the years 1959, 1963 and 1965.',explain:'1959 self-government → 1963 merger with Malaysia → 1965 independence.'},
{type:'Defend',q:'What strengthens Social Defence?',options:['Respecting people of different races and religions','Excluding those who are different','Spreading stereotypes'],a:0,hint:'Think about unity in diversity.',explain:'Mutual respect and trust build a cohesive society.'}]},
{title:'Against the Odds',zone:'The 1983 Cable Car Tragedy',gem:'💙',pillar:'Civil Defence',clue:'Everyone can help keep others safe.',intro:'Investigate a difficult rescue and what teamwork can teach us.',qs:[
{type:'Explore',q:'What transport system was involved in the 1983 tragedy featured here?',options:['Cable cars','MRT trains','Aeroplanes'],a:0,hint:'Look at the name and display of this section.',explain:'The exhibition recounts the 1983 cable car tragedy.'},
{type:'Solve',q:'What should emergency responders prioritise?',options:['Clear communication and safety','Everyone acting without a plan','Ignoring new information'],a:0,hint:'A rescue needs coordination.',explain:'Good coordination and safety help emergency teams respond effectively.'},
{type:'Defend',q:'How can students contribute to Civil Defence?',options:['Know emergency procedures and help safely','Block emergency exits','Spread unverified emergency rumours'],a:0,hint:'Think preparedness and safe actions.',explain:'Being prepared and following safety instructions helps protect the community.'}]},
{title:'The Singapore Story',zone:'Our Milestones',gem:'🩵',pillar:'Digital Defence',clue:'Think critically and protect our digital society.',intro:'See how Singapore has developed, then face a challenge from today’s digital world.',qs:[
{type:'Explore',q:'Explore Our Milestones. What is the main focus of this section?',options:['Important developments in Singapore’s journey','Dinosaurs in Singapore','The history of the Moon'],a:0,hint:'Look for achievements and key events.',explain:'Our Milestones highlights developments in Singapore’s story.'},
{type:'Solve',q:'Which development most directly improves everyday life?',options:['Better housing, education and healthcare','Fewer essential services','Less access to clean water'],a:0,hint:'Think about services families use.',explain:'Strong public services support people’s wellbeing.'},
{type:'Defend',q:'A shocking “breaking news” post appears online. What should your team do first?',options:['Check reliable sources before sharing','Forward it immediately','Assume every viral post is true'],a:0,hint:'Digital Defence includes checking information.',explain:'Verifying information helps prevent misinformation from spreading.'}]}];
const bonuses=[{q:'When is Singapore’s National Day?',o:['9 August','21 July','15 February'],a:0},{q:'When is Racial Harmony Day observed in schools?',o:['9 August','21 July','1 May'],a:1},{q:'Which is a pillar of Total Defence?',o:['Digital Defence','Shopping Defence','Holiday Defence'],a:0},{q:'How many pillars of Total Defence are there?',o:['Four','Five','Six'],a:2},{q:'What should you do before sharing alarming news?',o:['Check reliable sources','Forward it quickly','Guess whether it is true'],a:0},{q:'What helps build Social Defence?',o:['Respect and trust','Stereotypes','Exclusion'],a:0}];
const KEY='crestie-lost-timeline-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.done))state={team:'',cls:'',done:[],answers:{},bonusDone:[],bonusPoints:0,final:false};let screen='home',current=0,step=0,selected=-1,feedback=false,bonusQuestion=-1,bonusFrom='home',finalStep=0,finalSelected=-1;
const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hide'),2400)}function celebrate(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<26;i++){let x=document.createElement('div');x.className='confetti';x.style.left=Math.random()*100+'vw';x.style.background=['#f3c94c','#4ec7bc','#e872a1','#4f91d8'][i%4];x.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}}function score(){return state.done.length*30+state.bonusPoints+(state.final?20:0)}function render(){let html='';if(!state.team){html=`<section class="panel"><h2>Welcome, Time Explorer!</h2><p>Crestie needs your help to restore six mysterious crystals and activate the Shield of Singapore.</p><label for="cls">Select your class</label><select id="cls"><option value="">Choose class</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}">Class ${i+1}</option>`).join('')}</select><label for="team">Select your team</label><select id="team"><option value="">Choose team</option>${Array.from({length:5},(_,i)=>`<option value="${i+1}">Team ${i+1}</option>`).join('')}</select><button class="btn" id="start">Start the adventure!</button><div class="info" style="margin-top:12px">One phone per team. Team names and scores are stored only on this device in this prototype.</div></section>`;app.innerHTML=html;document.getElementById('start').onclick=()=>{let c=document.getElementById('cls').value,t=document.getElementById('team').value;if(!c||!t)return toast('Please choose a class and team.');state.cls=c;state.team=t;save();render()};return}
const top=`<section class="panel"><div class="row"><strong>Class ${esc(state.cls)} · Team ${esc(state.team)}</strong><span class="pill">⭐ ${score()} points</span></div><p class="small muted">${state.done.length} of 6 missions complete</p><div class="bar" aria-label="Mission progress"><div style="width:${state.done.length/6*100}%"></div></div><div class="crystals" aria-label="Collected crystals">${missions.map((m,i)=>`<span class="${state.done.includes(i)?'on':''}" title="${state.done.includes(i)?'Collected':'Locked'}">${m.gem}</span>`).join('')}</div></section>`;
if(screen==='home'){html=top+`<section class="panel"><h2>Choose your mission</h2><p class="muted small">Start with your recommended mission, then complete the others in any order. Please walk and follow gallery instructions.</p><div class="grid">${missions.map((m,i)=>`<button class="mission ${state.done.includes(i)?'done':''}" data-m="${i}"><span class="gem">${state.done.includes(i)?m.gem:'🔒'}</span><strong>${i+1}. ${m.title}</strong><span class="small muted">${m.zone}</span><br><span class="tiny">${state.done.includes(i)?'✓ Complete':(i===((Number(state.cls)-1)%6)?'★ Suggested start':'3 challenges')}</span></button>`).join('')}</div><button class="btn secondary" id="bonus" ${state.bonusDone.length===bonuses.length?'disabled':''}>⚡ Surprise bonus challenge (${bonuses.length-state.bonusDone.length} left)</button><button class="btn" id="final" ${state.done.length<6?'disabled':''}>🛡️ ${state.final?'View completed Shield':'Unlock the Shield of Singapore'}</button></section><section class="panel"><h2>Explorer instructions</h2><p>1. Find the named exhibition area.<br>2. Observe the exhibits and discuss with your team.<br>3. Answer three challenges to earn a crystal.<br>4. Collect all six crystals to unlock the finale.</p><p class="notice">⚠️ Prototype: Some “Explore” questions are broad and must be checked against the actual exhibition before launch.</p><button class="btn secondary" id="reset">Reset this device’s game</button></section>`;app.innerHTML=html;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.m);step=0;screen='mission';selected=-1;feedback=false;render()});document.getElementById('bonus').onclick=()=>openBonus('home');document.getElementById('final').onclick=()=>{screen='final';finalStep=0;finalSelected=-1;render()};document.getElementById('reset').onclick=()=>{if(confirm('Erase this team’s saved progress on this phone?')){localStorage.removeItem(KEY);location.reload()}};return}
if(screen==='mission'){const m=missions[current],done=state.done.includes(current),q=m.qs[step];html=top+`<section class="panel"><button class="btn secondary" id="back">← Mission menu</button><p class="tag" style="color:#247f9b;margin-top:18px">Mission ${current+1} · ${esc(m.zone)}</p><h2>${esc(m.title)}</h2><p>${esc(m.intro)}</p>${done?`<div class="callout success">✓ Crystal already collected! You can revisit these questions without gaining duplicate points.</div>`:''}<div class="steps">${[0,1,2].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><p class="pill" style="display:inline-block">Challenge ${step+1}/3 · ${q.type}</p><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="choice ${selected===i?'selected':''} ${feedback&&i===q.a?'correct':''} ${feedback&&selected===i&&i!==q.a?'wrong':''}" data-a="${i}" ${feedback?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<button class="btn secondary" id="hint">💡 Crestie's hint</button><button class="btn" id="check" ${selected<0||feedback?'disabled':''}>Check answer</button><div id="result"></div>${feedback&&selected===q.a?`<button class="btn" id="next">${step===2?'Collect crystal':'Next challenge →'}</button>`:''}</section>`;app.innerHTML=html;document.getElementById('back').onclick=()=>{screen='home';render()};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.a);render()});document.getElementById('hint').onclick=()=>toast(q.hint);document.getElementById('check').onclick=()=>{feedback=true;if(selected===q.a){celebrate();toast('Correct! Crestie is cheering! 🎉')}else toast('Not quite. Try again!');render()};if(feedback){document.getElementById('result').innerHTML=`<div class="callout ${selected===q.a?'success':'warning'}"><strong>${selected===q.a?'🎉 Correct!':'Try again!'}</strong><p>${selected===q.a?esc(q.explain):'Use the hint, talk to your team, and choose another answer.'}</p></div>`;if(selected!==q.a){document.getElementById('check').outerHTML='<button class="btn" id="retry">Try another answer</button>';document.getElementById('retry').onclick=()=>{feedback=false;selected=-1;render()}}else document.getElementById('next').onclick=()=>{if(step<2){step++;selected=-1;feedback=false;render()}else{if(!state.done.includes(current)){state.done.push(current);save();celebrate();toast('Crystal recovered! '+m.gem)}screen='reward';render()}}}return}
if(screen==='reward'){let m=missions[current];html=top+`<section class="panel" style="text-align:center"><div style="font-size:75px;animation:pop .6s">${m.gem}</div><h2>Crystal recovered!</h2><p>Crestie found a mysterious crystal in <strong>${esc(m.zone)}</strong>.</p><div class="callout">Clue: “${esc(m.clue)}”</div><p class="small muted">Keep its meaning in mind. You will need it for the final Shield challenge.</p><button class="btn" id="home">Continue the Amazing Race →</button></section>`;app.innerHTML=html;document.getElementById('home').onclick=()=>{screen='home';render()};return}
if(screen==='bonus'){let b=bonuses[bonusQuestion];html=top+`<section class="panel"><p class="tag" style="color:#247f9b">⚡ Surprise challenge</p><h2>Bonus question · 5 points</h2><p>${esc(b.q)}</p>${b.o.map((o,i)=>`<button class="choice ${selected===i?'selected':''}" data-a="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<button class="btn" id="submit" ${selected<0?'disabled':''}>Submit bonus answer</button><button class="btn secondary" id="skip">Skip bonus</button></section>`;app.innerHTML=html;document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{selected=Number(x.dataset.a);render()});document.getElementById('submit').onclick=()=>{let correct=selected===b.a;state.bonusDone.push(bonusQuestion);if(correct){state.bonusPoints+=5;celebrate()}save();toast(correct?'Bonus earned! +5 points 🎉':'Nice try! Keep exploring.');screen=bonusFrom;render()};document.getElementById('skip').onclick=()=>{screen=bonusFrom;render()};return}
if(screen==='final'){if(state.final){html=top+`<section class="panel" style="text-align:center"><div class="shield">🛡️✨</div><h2>Shield of Singapore Activated!</h2><p>Six pillars. One Singapore.</p><h2>🏆 ${score()} points</h2><p>I can, you can, we can!</p><button class="btn" id="home">Return to missions</button></section>`;app.innerHTML=html;document.getElementById('home').onclick=()=>{screen='home';render()};return}
let m=missions[finalStep];html=top+`<section class="panel"><div class="shield">🛡️</div><h2>Activate the Shield of Singapore</h2><p>Match each crystal’s clue to the correct pillar of Total Defence.</p><div class="steps">${missions.map((_,i)=>`<span class="${i<=finalStep?'on':''}"></span>`).join('')}</div><h2>${m.gem} Crystal ${finalStep+1}/6</h2><div class="callout">“${esc(m.clue)}”</div>${['Military Defence','Civil Defence','Economic Defence','Social Defence','Psychological Defence','Digital Defence'].map((p,i)=>`<button class="choice ${finalSelected===i?'selected':''}" data-f="${i}">${esc(p)}</button>`).join('')}<button class="btn" id="verify" ${finalSelected<0?'disabled':''}>Place crystal in shield</button><button class="btn secondary" id="home">← Mission menu</button></section>`;app.innerHTML=html;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{finalSelected=Number(b.dataset.f);render()});document.getElementById('verify').onclick=()=>{if(['Military Defence','Civil Defence','Economic Defence','Social Defence','Psychological Defence','Digital Defence'][finalSelected]!==m.pillar)return toast('That pillar does not match the clue. Try again!');celebrate();if(finalStep===5){state.final=true;save();toast('The Shield is activated!');render()}else{finalStep++;finalSelected=-1;toast('Crystal placed!');render()}};document.getElementById('home').onclick=()=>{screen='home';render()};return}}
function openBonus(from){let available=bonuses.map((_,i)=>i).filter(i=>!state.bonusDone.includes(i));if(!available.length)return toast('All bonus questions completed!');bonusQuestion=available[Math.floor(Math.random()*available.length)];bonusFrom=from;selected=-1;screen='bonus';render()}render();
</script></body></html>
